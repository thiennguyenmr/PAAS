version: '3.8'

# ==========================================
# NETWORKS & VOLUMES
# ==========================================
networks:
  llm-ops-net:
    driver: bridge

volumes:
  minio_data:
  airflow-postgres_data:
  etcd_data:
  milvus_data:
  postgre_data:

# ==========================================
# AIRFLOW INIT
# ==========================================
x-airflow-env: &airflow-env
  AIRFLOW__CORE__EXECUTOR: ${AIRFLOW__CORE__EXECUTOR}
  AIRFLOW__CORE__LOAD_EXAMPLES: ${AIRFLOW__CORE__LOAD_EXAMPLES}
  AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: ${AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION}
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW__DATABASE__SQL_ALCHEMY_CONN}
  PYTHONPATH: ${PYTHONPATH}

  AIRFLOW_POSTGRES_HOST: ${AIRFLOW_POSTGRES_HOST}
  AIRFLOW_POSTGRES_PORT: ${AIRFLOW_POSTGRES_PORT}
  AIRFLOW_POSTGRES_USER: ${AIRFLOW_POSTGRES_USER}
  AIRFLOW_POSTGRES_PASSWORD: ${AIRFLOW_POSTGRES_PASSWORD}
  AIRFLOW_POSTGRES_DB: ${AIRFLOW_POSTGRES_DB}

  AIRFLOW_ADMIN_USERNAME: ${AIRFLOW_ADMIN_USERNAME}
  AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
  AIRFLOW_ADMIN_EMAIL: ${AIRFLOW_ADMIN_EMAIL}
  AIRFLOW__CORE__EXECUTION_API_SERVER_URL: ${AIRFLOW__CORE__EXECUTION_API_SERVER_URL}
  AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET}
  AIRFLOW__API__SECRET_KEY: ${AIRFLOW__API__SECRET_KEY}
  AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY}

  # SimpleAuth configuration (for airflow 3.)
  AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: ${AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS}
  AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: ${AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE}

# =======================================================
# SERVICES
# =======================================================
services:

  # -----------------------------------------------------
  # 1. STORAGE: MinIO (S3) - RELEASE.2025-09-07T16-13-09Z
  # -----------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: minio-server
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ./docker/minio/minio_data:/data
    networks:
      - llm-ops-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio-test:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: minio-test-server
    command: server /data --console-address ":9001"
    ports:
      - "10000:9000"
      - "10001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ./minio_test/minio_data:/data
    networks:
      - llm-ops-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio-admin-api:
    build: 
      context: ./docker/minio-admin-api
      dockerfile: Dockerfile
    container_name: minio-admin-api
    ports:
      - "6061:8080" 
    environment:
      - SWAGGER_HOST=${SWAGGER_HOST}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT_URL}
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASS=${MINIO_ROOT_PASSWORD}
      - GIN_MODE=release
    depends_on:
      - minio
    networks:
      - llm-ops-net

  # -----------------------------------------------------
  # 2. RELATIONAL DB: POSTGRES:16
  # -----------------------------------------------------
  app-postgres-db:
    image: postgres:16
    container_name: app-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_APP_USER}         # Superuser username
      POSTGRES_PASSWORD: ${POSTGRES_APP_PASSWORD} # Superuser password
      POSTGRES_DB: ${POSTGRES_APP_DB}             # Default database created on startup
      PGDATA: /var/lib/postgresql/data/pgdata     # Recommended to avoid permission issues
    ports:
      - "5432:5432"
    volumes:
      - ./docker/postgre/postgres_data:/var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_APP_USER} -d ${POSTGRES_APP_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - llm-ops-net
  

  # -----------------------------------------------------
  # 3. VECTOR DB: Milvus & Etcd
  # -----------------------------------------------------
  etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.12
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
      ETCDCTL_API: "3"
    volumes:
      - ./docker/etcd/etcd_data:/etcd
    command: >
      etcd
      --name milvus-etcd
      --data-dir=/etcd
      --advertise-client-urls=http://etcd:2379
      --listen-client-urls=http://0.0.0.0:2379
      --initial-advertise-peer-urls=http://etcd:2380
      --listen-peer-urls=http://0.0.0.0:2380
      --initial-cluster=milvus-etcd=http://etcd:2380
      --log-level=info
    networks:
      - llm-ops-net
    healthcheck:
      test: ["CMD", "etcdctl", "--endpoints=http://127.0.0.1:2379", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
  milvus:
    container_name: milvus-standalone
    image: milvusdb/milvus:v2.6.8
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      ETCD_ROOT_PATH: milvus
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: minioadmin
      MINIO_SECRET_ACCESS_KEY: minioadmin
    volumes:
      - ./docker/milvus/milvus_data:/var/lib/milvus
    ports:
      - "19530:19530"   # Milvus gRPC
      - "9092:9091"     # Milvus Web UI
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - llm-ops-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s


  # -----------------------------------------------------
  # 3. PROCESSING: Spark (OFFICIAL IMAGE)
  # -----------------------------------------------------
  spark-master:
    build: ./docker/spark/                      
    image: my-spark:4.1.1-python3
    container_name: spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - '8081:8080' # UI
      - '7077:7077' # RPC
    volumes:
      - ./docker/spark/jobs:/opt/spark/jobs
    networks:
      - llm-ops-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  spark-worker-1:
    image: my-spark:4.1.1-python3
    container_name: spark-worker-1
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=2G
    depends_on:
      spark-master:
        condition: service_healthy
    volumes:
      - ./docker/spark/jobs:/opt/spark/jobs
    networks:
      - llm-ops-net

  spark-worker-2:
    image: my-spark:4.1.1-python3
    container_name: spark-worker-2
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=2G
    depends_on:
      spark-master:
        condition: service_healthy
    volumes:
      - ./docker/spark/jobs:/opt/spark/jobs
    networks:
      - llm-ops-net
      
  # -----------------------------------------------------
  # 4. ORCHESTRATOR: Airflow
  # -----------------------------------------------------

  airflow-postgres:
    image: postgres:16
    container_name: airflow-postgres
    environment:
      POSTGRES_USER: ${AIRFLOW_POSTGRES_USER}
      POSTGRES_PASSWORD: ${AIRFLOW_POSTGRES_PASSWORD}
      POSTGRES_DB: ${AIRFLOW_POSTGRES_DB}
    ports:
      - "5431:5432"
    volumes:
      - airflow-postgres_data:/var/lib/postgresql/data
    networks:
      - llm-ops-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AIRFLOW_POSTGRES_USER} -d ${AIRFLOW_POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  airflow-webserver:
    build: ./docker/airflow/                      
    image: my-airflow:3.1.4-python3.10
    container_name: airflow-webserver
    restart: always
    depends_on:
      airflow-postgres:
        condition: service_healthy
    environment:
      <<: *airflow-env
    ports:
      - "9091:8080"
    command: api-server
    volumes:
      - ./docker/airflow/dags:/opt/airflow/dags
      - ./docker/airflow/_module:/opt/airflow/_module
      - ./docker/airflow/scripts:/opt/airflow/scripts
      - ./docker/airflow/_config/:/opt/airflow/_config/
      - ./docker/airflow/logs:/opt/airflow/logs
      - ./docker/spark/jobs:/opt/spark/jobs
    networks:
      - llm-ops-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/v2/monitor/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  airflow-scheduler:
    image: my-airflow:3.1.4-python3.10
    container_name: airflow-scheduler
    restart: always
    depends_on:
      airflow-postgres:
        condition: service_healthy
      # airflow-webserver:
      #   condition: service_healthy
    environment:
      <<: *airflow-env
    command: scheduler
    volumes:
      - ./docker/airflow/dags:/opt/airflow/dags
      - ./docker/airflow/_module:/opt/airflow/_module
      - ./docker/airflow/scripts:/opt/airflow/scripts
      - ./docker/airflow/_config/:/opt/airflow/_config/
      - ./docker/airflow/logs:/opt/airflow/logs
      - ./docker/spark/jobs:/opt/spark/jobs
    networks:
      - llm-ops-net
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --local || exit 1"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 40s

  airflow-dag-processor:
    image: my-airflow:3.1.4-python3.10
    container_name: airflow-dag-processor
    restart: always
    depends_on:
      airflow-postgres:
        condition: service_healthy
      # airflow-webserver:
      #   condition: service_healthy
      # airflow-scheduler:
      #   condition: service_healthy
    environment:
      <<: *airflow-env
    command: dag-processor
    volumes:
      - ./docker/airflow/dags:/opt/airflow/dags
      - ./docker/airflow/_module:/opt/airflow/_module
      - ./docker/airflow/scripts:/opt/airflow/scripts
      - ./docker/airflow/_config/:/opt/airflow/_config/
      - ./docker/airflow/logs:/opt/airflow/logs
      - ./docker/spark/jobs:/opt/spark/jobs
    networks:
      - llm-ops-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "airflow jobs check --job-type DagProcessorJob --hostname \"$${HOSTNAME}\" || exit 1"
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s